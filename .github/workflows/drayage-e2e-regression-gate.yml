name: Fleet360 5-Phase Drayage & Driver App Regression Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target deployment URL for E2E regression suite'
        required: false
        default: 'https://fleet360-app-production.up.railway.app'

concurrency:
  group: drayage-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-type-gate:
    name: 'Gate 1: Runtime-DDL Guard & TypeScript Typecheck'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Verify zero runtime DDL in API routes
        run: node scripts/check-no-runtime-ddl.mjs

      - name: Run TypeScript compiler check
        run: npx tsc --noEmit

  e2e-5phase-regression-gate:
    name: 'Gate 2: 21-Check 5-Phase Playwright UI/UX & API Suite'
    needs: [static-and-type-gate]
    # Playwright has no Chromium build for ubuntu26.04 yet (ubuntu-latest);
    # pinned until it does, or the browser install fails before any test runs.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BASE_URL: ${{ github.event.inputs.target_url || vars.PLAYWRIGHT_BASE_URL || 'https://fleet360-app-production.up.railway.app' }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL || 'biju@trexla.ae' }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD || 'Trexla@2026' }}
      E2E_DRIVER_EMAIL: ${{ secrets.E2E_DRIVER_EMAIL || 'ATINERBIR@fastandsafe.com' }}
      E2E_DRIVER_PASSWORD: ${{ secrets.E2E_DRIVER_PASSWORD || 'Driver@123' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Execute 5-Phase (21-Check) Playwright Regression Suite
        run: npx playwright test tests/e2e/drayage-5phase-regression.spec.ts

      - name: Upload Playwright HTML Report & Traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drayage-5phase-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
