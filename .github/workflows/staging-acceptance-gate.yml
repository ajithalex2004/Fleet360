name: Staging Acceptance Release Gate

on:
  push:
    branches:
      - main
      - develop
      - 'feat/logistics-go-cutover-and-shipping-requests'
      - 'hardening/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: staging-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staging-acceptance-gate:
    name: Staging E2E Proxy & Tenant Isolation Acceptance Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      STAGING_APP_ORIGIN: https://fleet360-app-staging.up.railway.app
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Require STAGING_DATABASE_URL secret
        run: |
          if [ -z "$STAGING_DATABASE_URL" ]; then
            echo "::error::STAGING_DATABASE_URL secret is not set. This gate has no built-in default connection string — configure the repo/environment secret before this workflow can run."
            exit 1
          fi

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Execute Staging Acceptance & Isolation Suite
        id: run_tests
        env:
          # Only enforced on push (main/develop/hardening branches), where
          # Railway is expected to have already deployed this exact commit.
          # On pull_request there is no deployed candidate for the PR head
          # SHA yet — Railway doesn't deploy PR branches — so this check
          # would fail unconditionally regardless of the PR's content.
          # Leaving it unset here makes verifyCandidateBinding() skip the
          # SHA check (see scripts/verify-staging-proxy-e2e.js) while still
          # running the rest of the acceptance/isolation suite.
          EXPECTED_CANDIDATE_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
        run: |
          echo "Executing Staging Acceptance & E2E Isolation Gate against $STAGING_APP_ORIGIN${EXPECTED_CANDIDATE_SHA:+ for candidate $EXPECTED_CANDIDATE_SHA}..."
          npm run test:staging-acceptance
