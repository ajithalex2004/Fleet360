name: Phase 0 — Cross-tenant isolation tests

# Runs the complete Phase 0 cross-tenant isolation and integration test suite
# against ephemeral, throwaway PostgreSQL 16 service containers in CI.
#
# Each job builds the complete schema from 162 migrations via fresh-install-migrate.cjs,
# creates a restricted `fleet360_app` role with NOSUPERUSER NOBYPASSRLS, and
# verifies RLS enforcement via check-rls-enforcement.mjs before executing tests.
#
# Tests NEVER touch real or production databases (protected by tests/db-guard.ts
# and tests/protected-database-hosts.json from PR #228).
#
# Failure mode: any test failure exits non-zero and GitHub renders a red ✗.

on:
  push:
    branches: [main, 'hardening/**']
  pull_request:

concurrency:
  group: phase0-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  # ── Phase 0 SQL Syntax Check ────────────────────────────────────────────────
  sql-syntax:
    name: Phase 0 SQL syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install postgresql-client (psql + pg_format)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq postgresql-client

      # Run a parser-only check via psql. We never apply the migrations
      # here — that requires operator action. We just confirm Postgres
      # can parse the file. The migration scripts are idempotent
      # (every CREATE INDEX / ADD CONSTRAINT uses IF NOT EXISTS) so
      # running them against an empty DB is safe IF the referenced
      # tables don't exist — they wrap each statement in
      # `to_regclass() IS NOT NULL` checks so missing tables are
      # silently skipped, not errored.
      - name: Parse-check Phase 0 migrations (against throwaway DB)
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: phase0_ci_parse_check
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        run: |
          # Spin up a throwaway Postgres just to get a parser.
          sudo apt-get install -yqq postgresql
          sudo service postgresql start
          sudo -u postgres psql -c "ALTER USER postgres WITH PASSWORD 'postgres';"
          sudo -u postgres createdb phase0_ci_parse_check

          # Parse each migration file that exists.
          found_any=0
          for f in \
            prisma/migrations/tenant_isolation.sql \
            prisma/migrations/20260625_dispatch_tenant_isolation.sql \
            prisma/migrations/20260625_phase0_backfill_safety.sql \
            prisma/migrations/20260625_multi_tenant_saas_layer2_5.sql ; do
            if [ ! -f "$f" ]; then
              echo "::notice file=$f::Phase 0 migration removed from tree — skipping"
              continue
            fi
            found_any=1
            echo "::group::Parse-check $f"
            PGPASSWORD=postgres psql -h localhost -U postgres -d phase0_ci_parse_check -v ON_ERROR_STOP=1 \
              --single-transaction --set AUTOCOMMIT=off \
              -c "BEGIN;" -c "ROLLBACK;" < "$f" || {
              echo "::error file=$f::SQL syntax error in migration"
              exit 1
            }
            echo "::endgroup::"
          done
          if [ "$found_any" = "0" ]; then
            echo "No Phase 0 SQL files remain in tree — this check is now a stub. Consider removing the sql-syntax job when the phase-0 SQL layer is fully retired."
          fi

  # ── The TypeScript RLS suite ────────────────────────────────────────────────
  rls-isolation-ts:
    name: RLS isolation (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fleet360_rls_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      PHASE0_EXPECTED_ROLE: fleet360_app
      MIGRATE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fleet360_rls_ci?schema=public
      APP_DATABASE_URL: postgresql://fleet360_app:test@localhost:5432/fleet360_rls_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install postgresql-client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq postgresql-client

      - name: Create the restricted runtime role (fleet360_app)
        run: |
          PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d fleet360_rls_ci -v ON_ERROR_STOP=1 -c "
            DO \$\$
            BEGIN
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'fleet360_app') THEN
                CREATE ROLE fleet360_app WITH LOGIN PASSWORD 'test' NOSUPERUSER NOBYPASSRLS;
              END IF;
              ALTER ROLE fleet360_app SET search_path = \"\$user\", public, finance, ai, fleet, operations, spatial, workforce;
            END
            \$\$;
          "

      - name: Build the schema from the migrations
        env:
          DATABASE_URL: ${{ env.MIGRATE_DATABASE_URL }}
          DIRECT_URL: ${{ env.MIGRATE_DATABASE_URL }}
          BOOTSTRAP_RUNTIME_DATABASE_URL: ${{ env.APP_DATABASE_URL }}
          CONFIRM_FRESH_INSTALL: "1"
        run: node scripts/fresh-install-migrate.cjs --fresh-install

      # Proves the connection can actually enforce RLS BEFORE the suite runs.
      - name: Assert the role enforces RLS
        env:
          DATABASE_URL: ${{ env.APP_DATABASE_URL }}
        run: node scripts/check-rls-enforcement.mjs

      - name: Cross-tenant isolation suite
        env:
          DATABASE_URL: ${{ env.APP_DATABASE_URL }}
          TEST_DATABASE_URL: ${{ env.APP_DATABASE_URL }}
        run: npm run test:isolation:integration

      - name: Record the evidence
        if: always()
        run: |
          {
            echo "### RLS isolation (TypeScript)"
            echo ""
            echo "| check | value |"
            echo "|---|---|"
            echo "| expected role | \`$PHASE0_EXPECTED_ROLE\` |"
            echo "| database | throwaway postgres:16 for this job only |"
            echo "| enforcement asserted before the suite | yes |"
            echo ""
            echo "Assertions query BOTH tenants inside withTenantRls; only the"
            echo "policy can exclude the other tenant's rows."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Go Cross-Tenant Isolation Suite ─────────────────────────────────────────
  phase0:
    name: Cross-tenant isolation
    needs: [rls-isolation-ts]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fleet360_phase0_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      GOFLAGS: -mod=readonly
      PHASE0_REQUIRE_DB: "1"
      PHASE0_EXPECTED_ROLE: fleet360_app
      MIGRATE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fleet360_phase0_ci?schema=public
      APP_DATABASE_URL: postgresql://fleet360_app:test@localhost:5432/fleet360_phase0_ci?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install postgresql-client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq postgresql-client

      - name: Create the restricted runtime role (fleet360_app)
        run: |
          PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d fleet360_phase0_ci -v ON_ERROR_STOP=1 -c "
            DO \$\$
            BEGIN
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'fleet360_app') THEN
                CREATE ROLE fleet360_app WITH LOGIN PASSWORD 'test' NOSUPERUSER NOBYPASSRLS;
              END IF;
              ALTER ROLE fleet360_app SET search_path = \"\$user\", public, finance, ai, fleet, operations, spatial, workforce;
            END
            \$\$;
          "

      - name: Build the schema from the migrations
        env:
          DATABASE_URL: ${{ env.MIGRATE_DATABASE_URL }}
          DIRECT_URL: ${{ env.MIGRATE_DATABASE_URL }}
          BOOTSTRAP_RUNTIME_DATABASE_URL: ${{ env.APP_DATABASE_URL }}
          CONFIRM_FRESH_INSTALL: "1"
        run: node scripts/fresh-install-migrate.cjs --fresh-install

      - name: Setup Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Download Go modules
        working-directory: backend
        run: go mod download

      - name: Compile phasegate (catches obvious breakage before tests)
        working-directory: backend
        run: go build ./phasegate/...

      - name: Unit tests
        working-directory: backend
        env:
          PHASE0_REQUIRE_DB: "0"
          SKIP_DB_TESTS: "1"
        run: go test ./phasegate/... -count=1 -timeout 60s -v

      - name: Integration tests (live DB, fleet360_app)
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.APP_DATABASE_URL }}
          PHASE0_SMOKE_SUFFIX: ${{ github.run_id }}-${{ github.run_attempt }}
        run: go test ./phasegate/... -count=1 -timeout 480s -v -run Integration

      - name: Record the isolation evidence
        if: always()
        run: |
          {
            echo "### Phase 0 — cross-tenant isolation"
            echo ""
            echo "| check | value |"
            echo "|---|---|"
            echo "| expected role | \`$PHASE0_EXPECTED_ROLE\` |"
            echo "| database | throwaway postgres:16 for this job only, schema built from the migrations |"
            echo "| skips permitted | no (PHASE0_REQUIRE_DB=1) |"
            echo ""
            echo "Assertion count and connected role are printed by the suite itself"
            echo "under PHASE 0 PREFLIGHT and PHASE 0 SUMMARY in the job log."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: List phasegate tests (smoke check)
        working-directory: backend
        env:
          PHASE0_REQUIRE_DB: "0"
          SKIP_DB_TESTS: "1"
        run: go test ./phasegate/... -list '.*' | head -50

  # ── Leasing Return Workflow Integration ─────────────────────────────────────
  leasing-return-workflow-integration:
    name: Leasing return workflow (Postgres)
    needs: [phase0]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fleet360_leasing_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      PHASE0_EXPECTED_ROLE: fleet360_app
      MIGRATE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fleet360_leasing_ci?schema=public
      APP_DATABASE_URL: postgresql://fleet360_app:test@localhost:5432/fleet360_leasing_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install postgresql-client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq postgresql-client

      - name: Create the restricted runtime role (fleet360_app)
        run: |
          PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d fleet360_leasing_ci -v ON_ERROR_STOP=1 -c "
            DO \$\$
            BEGIN
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'fleet360_app') THEN
                CREATE ROLE fleet360_app WITH LOGIN PASSWORD 'test' NOSUPERUSER NOBYPASSRLS;
              END IF;
              ALTER ROLE fleet360_app SET search_path = \"\$user\", public, finance, ai, fleet, operations, spatial, workforce;
            END
            \$\$;
          "

      - name: Build the schema from the migrations
        env:
          DATABASE_URL: ${{ env.MIGRATE_DATABASE_URL }}
          DIRECT_URL: ${{ env.MIGRATE_DATABASE_URL }}
          BOOTSTRAP_RUNTIME_DATABASE_URL: ${{ env.APP_DATABASE_URL }}
          CONFIRM_FRESH_INSTALL: "1"
        run: node scripts/fresh-install-migrate.cjs --fresh-install

      - name: Assert the role enforces RLS
        env:
          DATABASE_URL: ${{ env.APP_DATABASE_URL }}
        run: node scripts/check-rls-enforcement.mjs

      - name: Leasing lifecycle + return-workflow integration suites
        env:
          DATABASE_URL: ${{ env.APP_DATABASE_URL }}
          TEST_DATABASE_URL: ${{ env.APP_DATABASE_URL }}
        run: npx vitest run tests/integration/leasing-lifecycle-postgres.test.ts tests/integration/leasing-return-workflow-postgres.test.ts

      - name: Record the evidence
        if: always()
        run: |
          {
            echo "### Leasing return workflow — PostgreSQL integration"
            echo ""
            echo "| check | value |"
            echo "|---|---|"
            echo "| expected role | \`$PHASE0_EXPECTED_ROLE\` |"
            echo "| database | throwaway postgres:16 for this job only |"
            echo "| enforcement asserted before the suite | yes |"
            echo ""
            echo "Covers: handover-triggered Phase 1/2 linking and its idempotency,"
            echo "the shared liability evaluator (no double-counting an invoiced"
            echo "charge), deposit application + reversal, cross-tenant isolation"
            echo "on the new tables, an executed early termination never getting"
            echo "overwritten by contract closure, and the full HTTP round trip"
            echo "through the actual route handlers."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Dunning & Collections Integration ───────────────────────────────────────
  dunning-collections-integration:
    name: Dunning & collections dispatch (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fleet360_dunning_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      PHASE0_EXPECTED_ROLE: fleet360_app
      MIGRATE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fleet360_dunning_ci?schema=public
      APP_DATABASE_URL: postgresql://fleet360_app:test@localhost:5432/fleet360_dunning_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install postgresql-client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq postgresql-client

      - name: Create the restricted runtime role (fleet360_app)
        run: |
          PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d fleet360_dunning_ci -v ON_ERROR_STOP=1 -c "
            DO \$\$
            BEGIN
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'fleet360_app') THEN
                CREATE ROLE fleet360_app WITH LOGIN PASSWORD 'test' NOSUPERUSER NOBYPASSRLS;
              END IF;
              ALTER ROLE fleet360_app SET search_path = \"\$user\", public, finance, ai, fleet, operations, spatial, workforce;
            END
            \$\$;
          "

      - name: Build the schema from the migrations
        env:
          DATABASE_URL: ${{ env.MIGRATE_DATABASE_URL }}
          DIRECT_URL: ${{ env.MIGRATE_DATABASE_URL }}
          BOOTSTRAP_RUNTIME_DATABASE_URL: ${{ env.APP_DATABASE_URL }}
          CONFIRM_FRESH_INSTALL: "1"
        run: node scripts/fresh-install-migrate.cjs --fresh-install

      - name: Assert the role enforces RLS
        env:
          DATABASE_URL: ${{ env.APP_DATABASE_URL }}
        run: node scripts/check-rls-enforcement.mjs

      - name: Dunning & collections integration suite
        env:
          DATABASE_URL: ${{ env.APP_DATABASE_URL }}
          TEST_DATABASE_URL: ${{ env.APP_DATABASE_URL }}
        run: npx vitest run tests/integration/dunning-collections-postgres.test.ts --testTimeout=120000

      - name: Record the evidence
        if: always()
        run: |
          {
            echo "### Dunning & collections dispatch — PostgreSQL integration"
            echo ""
            echo "| check | value |"
            echo "|---|---|"
            echo "| database | throwaway postgres:16 for this job only, schema built from the migrations |"
            echo "| role | \`$PHASE0_EXPECTED_ROLE\` (NOSUPERUSER NOBYPASSRLS) |"
            echo "| enforcement asserted before the suite | yes |"
            echo "| DUNNING_DISPATCH_ENABLED in this job | never set at the job level — only toggled transiently inside the test process for synthetic tenants |"
            echo ""
            echo "Covers the five decisive tests from the design plan (gate-off"
            echo "then deferred-recovery send; missing-transport then recovery;"
            echo "concurrent due-enqueue race; the send-attempt cap; reconciliation"
            echo "racing a late outcome write) plus a pre-dispatch-recheck race"
            echo "(suppressed after queuing, before the consumer runs), the legal-"
            echo "referral 130-day first-contact ladder, reopening/cycle-increment,"
            echo "cross-tenant RLS isolation on the five new tables, and append-only"
            echo "enforcement on lease_dunning_stage_transitions."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Audit Log Race Integration ──────────────────────────────────────────────
  audit-log-race-integration:
    name: Audit log transaction race (Postgres)
    needs: [dunning-collections-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fleet360_audit_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      PHASE0_EXPECTED_ROLE: fleet360_app
      MIGRATE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fleet360_audit_ci?schema=public
      APP_DATABASE_URL: postgresql://fleet360_app:test@localhost:5432/fleet360_audit_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
