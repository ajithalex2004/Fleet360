          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install postgresql-client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq postgresql-client

      - name: Create the restricted runtime role (fleet360_app)
        run: |
          PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d fleet360_audit_ci -v ON_ERROR_STOP=1 -c "
            DO \$\$
            BEGIN
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'fleet360_app') THEN
                CREATE ROLE fleet360_app WITH LOGIN PASSWORD 'test' NOSUPERUSER NOBYPASSRLS;
              END IF;
              ALTER ROLE fleet360_app SET search_path = \"\$user\", public, finance, ai, fleet, operations, spatial, workforce;
            END
            \$\$;
          "

      - name: Build the schema from the migrations
        env:
          DATABASE_URL: ${{ env.MIGRATE_DATABASE_URL }}
          DIRECT_URL: ${{ env.MIGRATE_DATABASE_URL }}
          BOOTSTRAP_RUNTIME_DATABASE_URL: ${{ env.APP_DATABASE_URL }}
          CONFIRM_FRESH_INSTALL: "1"
        run: node scripts/fresh-install-migrate.cjs --fresh-install

      - name: Assert the role enforces RLS
        env:
          DATABASE_URL: ${{ env.APP_DATABASE_URL }}
        run: node scripts/check-rls-enforcement.mjs

      - name: Audit log transaction race suite
        env:
          DATABASE_URL: ${{ env.APP_DATABASE_URL }}
          TEST_DATABASE_URL: ${{ env.APP_DATABASE_URL }}
        run: npx vitest run tests/integration/audit-log-race.test.ts

      - name: Record the evidence
        if: always()
        run: |
          {
            echo "### Audit log transaction race — PostgreSQL integration"
            echo ""
            echo "| check | value |"
            echo "|---|---|"
            echo "| expected role | \`$PHASE0_EXPECTED_ROLE\` |"
            echo "| database | throwaway postgres:16 for this job only |"
            echo "| enforcement asserted before the suite | yes |"
            echo ""
            echo "Covers: the tightest version of #72's original race (fire-and-"
            echo "forget logAudit call inside a transaction callback that commits"
            echo "on the next tick), independence from the caller's rollback,"
            echo "cross-tenant RLS isolation on audit_logs, the no-tenantId case"
            echo "(caught, not thrown — see #83), and logAuditInTx's opposite,"
            echo "shares-the-caller's-transaction behavior in both directions."
          } >> "$GITHUB_STEP_SUMMARY"
