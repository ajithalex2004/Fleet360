name: Phase 0 — Cross-tenant isolation tests

# Runs the phasegate package's full test suite (unit + integration)
# against a live Postgres on every PR. The integration tests verify
# that the GORM auth.WithTenant(c) scope actually scopes queries by
# tenant_id — the foundational guarantee Phase 0 ships. If a future
# commit breaks this isolation, this workflow fails the PR.
#
# REQUIRED SECRET: PHASE0_DATABASE_URL
#
# This job used to gate the integration step on `if: env.NEON_DATABASE_URL
# != ''` while no such secret was configured, so the step never ran and the
# check reported SUCCESS having executed zero cross-tenant assertions. It was
# green from 2026-04 onward while proving only that Go compiled.
#
# The secret is now mandatory: a missing one FAILS the job. No database, no app
# role, no assertions = red. Not skipped, not a warning.
#
# The connection string must point at the fleet360_app role, NOT the
# application's current DATABASE_URL. That one connects as neondb_owner, which
# holds rolbypassrls, and under it every isolation assertion passes on
# application WHERE clauses alone while RLS contributes nothing — a green run
# that proves the opposite of what it claims. The suite's preflight rejects a
# BYPASSRLS role for exactly this reason, so CI becomes the first place RLS is
# genuinely exercised, before the application runtime is switched.
#
# Use a dedicated branch or schema so concurrent PRs don't trample each other.
#
# Failure mode: any test failure exits non-zero and GitHub renders a red ✗.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: phase0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase0:
    name: Cross-tenant isolation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GOFLAGS: -mod=readonly
      # Turns every skip path in the suite into a hard failure. See
      # requireDB() and TestMain() in backend/phasegate/phasegate_test.go.
      PHASE0_REQUIRE_DB: "1"
      PHASE0_EXPECTED_ROLE: fleet360_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Download Go modules
        working-directory: backend
        run: go mod download

      - name: Compile phasegate (catches obvious breakage before tests)
        working-directory: backend
        run: go build ./phasegate/...

      # Unit tests run always — no DB required. These verify the gate
      # state machine, middleware routing, escape hatch, and the
      # recheckLoop logic with mocked check functions. Fast (~3s).
      # Unit tests deliberately run OUTSIDE required mode: they need no
      # database, and PHASE0_REQUIRE_DB would fail them for not having one.
      - name: Unit tests
        working-directory: backend
        env:
          PHASE0_REQUIRE_DB: "0"
          SKIP_DB_TESTS: "1"
        run: go test ./phasegate/... -count=1 -timeout 60s -v

      # The secret is checked BEFORE the tests, so a missing one reads as
      # "not configured" rather than surfacing later as a confusing Go
      # failure. Deliberately not an `if:` — a conditional step that does not
      # run is reported as success, which is the whole defect being removed.
      - name: Require the database secret
        env:
          PHASE0_DATABASE_URL: ${{ secrets.PHASE0_DATABASE_URL }}
        run: |
          if [ -z "$PHASE0_DATABASE_URL" ]; then
            echo "::error title=PHASE0_DATABASE_URL is not configured::The cross-tenant isolation suite cannot run without it. This job fails rather than reporting a green tick for a suite that never executed."
            echo "Set the repository secret PHASE0_DATABASE_URL to a connection string for the"
            echo "fleet360_app role — NOT the application's DATABASE_URL, which connects as"
            echo "neondb_owner and holds rolbypassrls. Under a BYPASSRLS role every isolation"
            echo "assertion passes whether or not isolation actually works."
            exit 1
          fi
          echo "secret present (${#PHASE0_DATABASE_URL} chars)"

      # Exercises the real auth.WithTenant(c) GORM scope against a live
      # database as a non-BYPASSRLS role. TestMain fails the run if the role
      # holds BYPASSRLS, or if zero cross-tenant assertions execute.
      - name: Integration tests (live DB, fleet360_app)
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.PHASE0_DATABASE_URL }}
        run: go test ./phasegate/... -count=1 -timeout 180s -v -run Integration

      # Re-assert the preflight facts in the job summary so the evidence is
      # visible without opening the log.
      - name: Record the isolation evidence
        if: always()
        env:
          SECRET_PRESENT: ${{ secrets.PHASE0_DATABASE_URL != '' }}
        run: |
          {
            echo "### Phase 0 — cross-tenant isolation"
            echo ""
            echo "| check | value |"
            echo "|---|---|"
            echo "| expected role | \`$PHASE0_EXPECTED_ROLE\` |"
            echo "| secret configured | $SECRET_PRESENT |"
            echo "| skips permitted | no (PHASE0_REQUIRE_DB=1) |"
            echo ""
            echo "Assertion count and connected role are printed by the suite itself"
            echo "under PHASE 0 PREFLIGHT and PHASE 0 SUMMARY in the job log."
          } >> "$GITHUB_STEP_SUMMARY"

      # Smoke check on the run itself — catches the "tests were deleted by
      # mistake" failure mode.
      #
      # Runs outside required mode: `go test -list` still executes TestMain,
      # which would fail for having no DATABASE_URL of its own.
      - name: List phasegate tests (smoke check)
        working-directory: backend
        env:
          PHASE0_REQUIRE_DB: "0"
          SKIP_DB_TESTS: "1"
        run: go test ./phasegate/... -list '.*' | head -50

  # Companion job: verifies the dispatch migration + Phase 0 SQL
  # scripts compile cleanly. Doesn't apply them — that's a separate
  # one-time apply step done manually against staging. Catches syntax
  # errors in the .sql files on every PR.
  sql-syntax:
    name: Phase 0 SQL syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install postgresql-client (psql + pg_format)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq postgresql-client

      # Run a parser-only check via psql. We never apply the migrations
      # here — that requires operator action. We just confirm Postgres
      # can parse the file. The migration scripts are idempotent
      # (every CREATE INDEX / ADD CONSTRAINT uses IF NOT EXISTS) so
      # running them against an empty DB is safe IF the referenced
      # tables don't exist — they wrap each statement in
      # `to_regclass() IS NOT NULL` checks so missing tables are
      # silently skipped, not errored.
      - name: Parse-check Phase 0 migrations (against throwaway DB)
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: phase0_ci_parse_check
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        run: |
          # Spin up a throwaway Postgres just to get a parser.
          sudo apt-get install -yqq postgresql
          sudo service postgresql start
          sudo -u postgres psql -c "ALTER USER postgres WITH PASSWORD 'postgres';"
          sudo -u postgres createdb phase0_ci_parse_check

          # Parse each migration file that exists. The list historically
          # included several top-level Phase 0 SQL scripts that have
          # since been removed (see chore 7ca921d2 — legacy top-level
          # scripts + superseded ops migrations). Skip missing files
          # rather than fail — a removed migration isn't a syntax error.
          # If ALL files are absent, the loop simply prints a note and
          # the job passes.
          found_any=0
          for f in \
            prisma/migrations/tenant_isolation.sql \
            prisma/migrations/20260625_dispatch_tenant_isolation.sql \
            prisma/migrations/20260625_phase0_backfill_safety.sql \
            prisma/migrations/20260625_multi_tenant_saas_layer2_5.sql ; do
            if [ ! -f "$f" ]; then
              echo "::notice file=$f::Phase 0 migration removed from tree — skipping"
              continue
            fi
            found_any=1
            echo "::group::Parse-check $f"
            PGPASSWORD=postgres psql -h localhost -U postgres -d phase0_ci_parse_check -v ON_ERROR_STOP=1 \
              --single-transaction --set AUTOCOMMIT=off \
              -c "BEGIN;" -c "ROLLBACK;" < "$f" || {
              echo "::error file=$f::SQL syntax error in migration"
              exit 1
            }
            echo "::endgroup::"
          done
          if [ "$found_any" = "0" ]; then
            echo "No Phase 0 SQL files remain in tree — this check is now a stub. Consider removing the sql-syntax job when the phase-0 SQL layer is fully retired."
          fi
