name: CI

on:
  push:
    branches: [main, 'hardening/**', 'review/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Build-time env. CI uses dummies — real values come from prod secrets.
      DATABASE_URL: postgresql://user:pass@localhost:5432/ci_mock?sslmode=disable
      SESSION_SECRET: ci-session-secret-must-be-at-least-32-chars-long
      THESYS_API_KEY: ci-dummy-thesys-key
      OPENAI_API_KEY: ci-dummy-openai-key
      NEXT_TELEMETRY_DISABLED: "1"

    # Local Postgres for the schema-drift check. `prisma migrate diff
    # --shadow-database-url` requires a reachable Postgres to spin up
    # its temporary shadow DB. Credentials + port match DATABASE_URL
    # above (user/pass@localhost:5432). The `ci_mock` database is
    # created automatically by the postgres container's POSTGRES_DB.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: ci_mock
        ports:
          - 5432:5432
        # Wait until Postgres is actually accepting connections before
        # subsequent steps run — a race here would produce the same
        # P1001 "can't reach database server" error we're fixing.
        options: >-
          --health-cmd "pg_isready -U user -d ci_mock"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        # --legacy-peer-deps because the dependency tree has a known
        # peer-conflict: @crayonai/react-core@0.7.6 (transitive via
        # @thesysai/genui-sdk + @crayonai/react-ui) declares
        # peer zustand@^4.5.5 while the root project depends on
        # zustand@^5.0.8. Both versions resolve fine at runtime; npm's
        # strict resolution refuses. Remove this flag once the upstream
        # @crayonai/react-core publishes a version with `peer zustand@5`.
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      # ── Schema-drift guard ────────────────────────────────────────────────
      # Fails the build if the actual database schema and schema.prisma diverge.
      #
      # `prisma migrate diff` compares the schema.prisma data model against the
      # migrations that would be applied to a fresh database. A non-empty diff
      # means someone added a column (or table) in a migration file without
      # updating schema.prisma — exactly the FinanceInvoice / FinancePayment
      # orphan-column anti-pattern we eliminated in this session.
      #
      # --from-migrations: baseline is the full migration history
      # --to-schema-datamodel: target is the current schema.prisma
      # --exit-code: exits with code 2 if the diff is non-empty (CI fails)
      #
      # This step does NOT need a live database; it compares the migration SQL
      # history against schema.prisma in-memory using the shadow database logic.
      # ── Runtime-DDL ratchet ───────────────────────────────────────────────
      # Blocks any new ensureTable / ensureTables / ensureTableAndSeed /
      # bootstrap function from entering the codebase.  The 36 pre-existing
      # violations are in an allowlist inside the script; they fail only if
      # the count *increases*.  Remove entries from the allowlist as each
      # file is migrated to a proper Prisma migration.
      - name: Runtime-DDL guard
        run: node scripts/check-no-runtime-ddl.mjs

      - name: Schema drift check
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$DATABASE_URL" \
            --exit-code
        continue-on-error: true
        # TODO(KNOWN-DRIFT-001): several 2026-08 raw SQL migrations under
        # prisma/raw/ (spatial.places, alert engine, route versioning,
        # BusRouteVariant, extended Alert, place FKs on Garage/RouteStop/
        # Vehicle) were applied to prod but never captured as Prisma
        # migration files. Prisma migrate diff correctly flags the
        # divergence between prisma/migrations and schema.prisma. The
        # check still runs and prints the diff for humans to see, but no
        # longer blocks the PR — same soft pattern the Lint / Typecheck /
        # Unit-tests steps below already use.
        #
        # To close: convert each prisma/raw/*.sql into a proper Prisma
        # migration under prisma/migrations/<timestamp>_*/migration.sql
        # (idempotent — most raw SQL already uses IF NOT EXISTS / ON
        # CONFLICT DO NOTHING). Once caught up, remove this
        # continue-on-error line and re-enforce.

      - name: Lint
        run: npm run lint
        continue-on-error: true   # TODO(KNOWN-TS-001): re-enforce after pre-existing
                                   # ESLint warnings are cleaned up.

      # ── Lint ratchet ────────────────────────────────────────────────
      # Same pattern as the typecheck ratchet below: the codebase has ~3,014
      # pre-existing ESLint errors (mostly no-unused-vars / no-explicit-any),
      # which is why the raw Lint step above is advisory. This blocks on any
      # NEW error or any existing file's error count going UP, per rule, vs
      # scripts/lint-baseline.json — pre-existing errors are grandfathered,
      # the total can only shrink. Run `node scripts/check-lint-ratchet.mjs
      # --update-baseline` after actually fixing errors to lock in the lower
      # count.
      - name: Lint ratchet (blocks new errors only)
        run: node scripts/check-lint-ratchet.mjs

      # Private-repo GitHub runners have 7 GB of memory, and Node's default
      # heap limit (~2 GB there) is too small for tsc and next build on this
      # codebase: both died with "JavaScript heap out of memory" after the
      # repository went private. 4 GB leaves room for the Postgres service;
      # next build's worker processes each inherit this cap.
      - name: Typecheck (Blocking)
        run: npm run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # ── Typecheck ratchet ────────────────────────────────────────────────
      # Enforces fail-closed ratchet behavior: multi-line diagnostic chains,
      # semantic detail preservation, per-file totals, error-code counts,
      # fingerprint multiplicities, and schemaVersion 2 baseline integrity.
      - name: Typecheck Ratchet Self-Tests (Blocking)
        run: npx vitest run tests/unit/check-typecheck-ratchet.test.ts

      - name: Typecheck ratchet (blocks new errors only)
        run: node scripts/check-typecheck-ratchet.mjs
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Credential Leak Guard (Blocking)
        run: npm run check:credentials

      - name: Runtime Migration Secret Isolation Guard (Blocking)
        run: node scripts/check-no-runtime-migration-secrets.mjs

      - name: Security & Session Key Hardening Gate (Blocking)
        run: npx vitest run tests/unit/session-secret.test.ts tests/unit/credential-leak-guard.test.ts

      # ── Unit-test database ─────────────────────────────────────────────────
      # Unit tests that need a database (tests/db-guard.ts hasTestDatabase)
      # used to run against ci_mock, which has no migrations applied (it is
      # the drift check's shadow database), so they failed on missing tables
      # and columns — and the step was continue-on-error, so nobody noticed
      # when other tests broke too. They now get their own database, migrated
      # with the same fresh-install runner the replay workflow verifies.
      - name: Unit-test database (fresh, migrated)
        env:
          PGPASSWORD: pass
          DATABASE_URL: postgresql://user:pass@localhost:5432/ci_unit?sslmode=disable
          DIRECT_URL: postgresql://user:pass@localhost:5432/ci_unit?sslmode=disable
          BOOTSTRAP_RUNTIME_DATABASE_URL: postgresql://fleet360_app:test@localhost:5432/ci_unit?sslmode=disable
          CONFIRM_FRESH_INSTALL: "1"
        run: |
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -yqq postgresql-client; }
          psql -h localhost -U user -d ci_mock -v ON_ERROR_STOP=1 -c "CREATE DATABASE ci_unit"
          # Runtime role the migrations grant to (see migration-safety.yml).
          psql -h localhost -U user -d ci_unit -v ON_ERROR_STOP=1 -c "
            DO \$\$
            BEGIN
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'fleet360_app') THEN
                CREATE ROLE fleet360_app WITH LOGIN PASSWORD 'test' NOSUPERUSER NOBYPASSRLS;
              END IF;
              ALTER ROLE fleet360_app SET search_path = \"\$user\", public, finance, ai, fleet, operations, spatial, workforce;
            END
            \$\$;
          "
          node scripts/fresh-install-migrate.cjs --fresh-install

      - name: Unit tests (Blocking)
        run: npm run test:unit
        env:
          TEST_DATABASE_URL: postgresql://user:pass@localhost:5432/ci_unit?sslmode=disable

      - name: Public Endpoint Identity Boundary (Blocking)
        run: |
          npx tsc --noEmit -p tsconfig.c1.json
          npx vitest run tests/unit/public-endpoint-auth.test.ts tests/unit/middleware-identity-boundary.test.ts tests/unit/middleware-identity-headers.test.ts tests/unit/push-run-scheduler-auth.test.ts

      - name: Build (Next.js)
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
