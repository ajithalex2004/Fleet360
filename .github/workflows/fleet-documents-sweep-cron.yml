name: Fleet documents sweep (cron)

# Triggers the fleet document-expiry / auto-grounding sweep on a schedule.
#
# The app's own job scheduler now runs this sweep daily at 07:00 Dubai
# (03:00 UTC; src/lib/jobs/scheduler.ts), so this workflow is manual-only:
# a schedule here would run it twice. CRON_SECRET must match the value
# configured on the Railway service (mirrored into this repo's Actions secrets).
#
# The job itself iterates every active tenant server-side (see
# src/lib/jobs/fleet-documents-sweep.ts) — this workflow just needs to
# call the dispatcher once.

on:
  workflow_dispatch: {}   # manual run (the daily run is the app's scheduler)

concurrency:
  group: fleet-documents-sweep-cron
  cancel-in-progress: false

jobs:
  run-sweep:
    runs-on: ubuntu-latest
    # runSweep iterates every active tenant (164 at last count) in its own
    # transaction. Measured elsewhere in this codebase at ~700ms/tenant
    # serially against the pooled Neon endpoint (this app's DATABASE_URL),
    # which is what this app uses -- so a full run is minutes, not seconds.
    # Generous timeout to avoid a false failure while the server is still
    # legitimately working through the list.
    timeout-minutes: 15
    steps:
      - name: Trigger fleet-documents-sweep
        run: |
          curl -sf -X POST \
            "https://fleet360-app-production.up.railway.app/api/jobs/run?job=fleet-documents-sweep" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --data '{}' \
            --max-time 840
