name: Build Check

on:
  push:
    branches: [ main, 'hardening/**' ]
  pull_request:
    branches: [ main, staging, develop ]
  workflow_dispatch:

jobs:
  build:
    name: Production Build (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/ci_mock?sslmode=disable
      SESSION_SECRET: ci-session-secret-must-be-at-least-32-chars-long
      OPENAI_API_KEY: ci-dummy-openai-key
      THESYS_API_KEY: dummy-api-key-for-testing
      NEXT_TELEMETRY_DISABLED: "1"
    
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci --legacy-peer-deps

    - name: Generate Prisma client
      run: npx prisma generate
      
    - name: Run build
      run: npm run build
