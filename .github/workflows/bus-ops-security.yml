name: Bus Ops security gates
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  policy-and-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:1/fleet360_test
      DIRECT_URL: postgresql://test:test@127.0.0.1:1/fleet360_test
      SESSION_SECRET: ci-only-session-secret-not-a-production-credential
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - run: npx tsc --noEmit --pretty false
      - name: Policy, isolation and safety regressions
        run: >-
          npx vitest run
          tests/unit/bus-ops-disruptions.test.ts
          tests/unit/bus-rider-notifications.test.ts
          tests/unit/bus-ops-trip-notification-events.test.ts
          tests/unit/bus-ops-authoritative-access.test.ts
          tests/unit/bus-ops-enterprise-policy.test.ts
          tests/unit/bus-ops-device-parent-isolation.test.ts
          tests/unit/bus-gateway-events-auth.test.ts
          tests/unit/bus-ops-state-machines.test.ts
          tests/unit/bus-ops-admin-resources.test.ts
          tests/unit/validate-assignment.test.ts
          tests/unit/authz-policy-matrix.test.ts
          tests/unit/permissions.test.ts
          --maxWorkers=2 --minWorkers=1

  rider-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: fleet360_rider_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/fleet360_rider_test
      DIRECT_URL: postgresql://postgres:test@127.0.0.1:5432/fleet360_rider_test
      TEST_RIDER_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/fleet360_rider_test
      DISABLE_OUTBOUND_NOTIFICATIONS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - run: npx vitest run tests/integration/bus-rider-delivery-postgres.test.ts --maxWorkers=1 --minWorkers=1

  disruption-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: fleet360_disruption_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/fleet360_disruption_test
      DIRECT_URL: postgresql://postgres:test@127.0.0.1:5432/fleet360_disruption_test
      TEST_DISRUPTION_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/fleet360_disruption_test
      DISABLE_OUTBOUND_NOTIFICATIONS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - run: npx vitest run tests/integration/bus-disruption-postgres.test.ts --maxWorkers=1 --minWorkers=1
