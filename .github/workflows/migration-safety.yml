name: Migration Safety

# Blocks destructive SQL from entering prisma/migrations/.
#
# prisma/schema.prisma does not model large parts of the live database, so
# `prisma migrate dev` will happily generate a migration that drops ~174 real
# tables (including finance.finance_chart_of_accounts, the Workflow* and admin_*
# tables, and tenant_id isolation columns). The dangerous path is not malice —
# it is a dev adding one field, Prisma quietly generating the drops alongside it,
# and the PR being reviewed as "add one field".
#
# See scripts/check-destructive-migrations.js for the allowlist mechanism.

on:
  # NO `paths:` filter on pull_request, deliberately - see tenant-rls-check.yml
  # for the full reasoning. Required + path-filtered = merges blocked forever on
  # any PR that does not touch the filtered paths.
  #
  # The push filter below is kept: on main the job only needs to re-run when the
  # migrations or the checker itself change, and nothing is waiting on its
  # status there.
  pull_request:
  push:
    branches:
      - main
      - develop
    # This list once covered only prisma/**, so an edit to the checker — or to
    # its ALLOWLIST, the change that most needs re-verifying — did not re-run
    # the check on main. The job kept displaying its last red result while the
    # fix for it sat merged and unverified.
    #
    # Weakening the allowlist is exactly the edit that must not slip through
    # unchecked, so the checker and this workflow are both in the list.
    paths:
      - 'prisma/**'
      - 'scripts/check-destructive-migrations.js'
      - 'scripts/fresh-install-migrate.cjs'
      - 'scripts/verify-fresh-install-postflight.cjs'
      - 'tests/integration/rental-journal-schema-regression.cjs'
      - 'tests/unit/fresh-install-migrate.test.ts'
      - '.github/workflows/migration-safety.yml'
  # So the check can be re-run on demand without an unrelated prisma/ change.
  workflow_dispatch:

jobs:
  check-destructive-migrations:
    name: Destructive Migration Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Deliberately no `npm ci` — the checker is dependency-free so this job
      # stays fast and cannot be broken by an unrelated install failure.
      - name: Check migrations for destructive SQL
        id: check
        run: |
          set +e
          node scripts/check-destructive-migrations.js > migration-report.txt 2>&1
          EXIT_CODE=$?
          set -e

          cat migration-report.txt

          {
            echo "## Migration Safety Check"
            echo ""
            echo '```'
            cat migration-report.txt
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

          exit $EXIT_CODE

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-safety-report
          path: migration-report.txt
          retention-days: 30

      - name: Comment on PR
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('migration-report.txt', 'utf8');
            const body = [
              '## 🛑 Destructive migration detected',
              '',
              'This PR adds a migration containing `DROP TABLE`, `DROP COLUMN`,',
              '`DROP SCHEMA`, `DROP DATABASE`, or `TRUNCATE`.',
              '',
              '**If Prisma generated this for you, do not merge it.**',
              '`prisma/schema.prisma` does not model large parts of the live',
              'database, so `prisma migrate dev` produces migrations that drop',
              'real tables — including the `tenant_id` columns that enforce',
              'tenant isolation.',
              '',
              'Hand-write an additive migration instead. See',
              '`prisma/migrations/20260903000000_add_breakdown_reports` for the',
              'pattern (`CREATE TABLE IF NOT EXISTS` / `ADD COLUMN IF NOT EXISTS`).',
              '',
              'If the deletion is genuinely intended, add the migration to',
              '`ALLOWLIST` in `scripts/check-destructive-migrations.js` with a',
              'reason so it is reviewed as a deliberate data deletion.',
              '',
              '<details><summary>Full report</summary>',
              '',
              '```',
              report,
              '```',
              '',
              '</details>',
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  fresh-database-replay:
    name: Fresh DB Bootstrap & Replay Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fleet360_fresh_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fleet360_fresh_ci?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/fleet360_fresh_ci?schema=public
      BOOTSTRAP_RUNTIME_DATABASE_URL: postgresql://fleet360_app:test@localhost:5432/fleet360_fresh_ci
      CONFIRM_FRESH_INSTALL: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install postgresql-client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq postgresql-client

      - name: Run unit test suite for bootstrap runner and postflight
        run: |
          npx vitest run tests/unit/fresh-install-migrate.test.ts tests/unit/verify-fresh-install-postflight.test.ts

      # Pre-provision runtime role (fleet360_app) required by 20260915210000_fresh_replay_grant_app_role_schema_access
      - name: Pre-provision runtime role (fleet360_app)
        run: |
          PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d fleet360_fresh_ci -c "
            DO \$\$
            BEGIN
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'fleet360_app') THEN
                CREATE ROLE fleet360_app WITH LOGIN PASSWORD 'test' NOSUPERUSER NOBYPASSRLS;
              END IF;
              ALTER ROLE fleet360_app SET search_path = \"\$user\", public, finance, ai, fleet, operations, spatial, workforce;
            END
            \$\$;
          "

      - name: Concurrency test (competing background runner with advisory lock)
        run: |
          # Spawn background psql session holding advisory lock 8839210
          PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d fleet360_fresh_ci -c "SELECT pg_advisory_lock(8839210); SELECT pg_sleep(5);" &
          BG_PID=$!
          sleep 1

          # Assert that fresh-install-migrate aborts immediately when advisory lock is held
          if node scripts/fresh-install-migrate.cjs --fresh-install; then
            echo "::error::fresh-install-migrate succeeded despite competing advisory lock holder!"
            kill $BG_PID || true
            exit 1
          fi
          echo "✓ Confirmed: fresh-install-migrate aborted cleanly when advisory lock was held."
          wait $BG_PID || true

      - name: Run fresh database bootstrap runner
        run: |
          node scripts/fresh-install-migrate.cjs --fresh-install

      - name: Confirm no unresolved migrations remain
        run: |
          UNRESOLVED=$(PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d fleet360_fresh_ci -t -A -c "
            SELECT COUNT(*) FROM \"_prisma_migrations\" m1
            WHERE m1.finished_at IS NULL
              AND m1.rolled_back_at IS NULL
              AND NOT EXISTS (
                SELECT 1 FROM \"_prisma_migrations\" m2
                WHERE m2.migration_name = m1.migration_name
                  AND m2.finished_at IS NOT NULL
              );
          ")
          echo "Unresolved migration attempts: $UNRESOLVED"
          if [ "$UNRESOLVED" -ne "0" ]; then
            echo "::error::Unresolved migrations found in _prisma_migrations!"
            exit 1
          fi
          npx prisma migrate status

      - name: Run post-flight verification (schema, privileges, dual-tenant RLS)
        run: |
          node scripts/verify-fresh-install-postflight.cjs

      - name: Rental prerequisite and journal UUID regression checks
        env:
          CONFIRM_SCHEMA_REGRESSION_TEST: "1"
        run: node tests/integration/rental-journal-schema-regression.cjs

      - name: Interrupted bootstrap resumption validation
        run: |
          # 1. Running without resume flag against non-fresh DB must fail
          if node scripts/fresh-install-migrate.cjs --fresh-install; then
            echo "::error::fresh-install-migrate succeeded on populated DB without resume flag!"
            exit 1
          fi
          echo "✓ Confirmed: fresh-install-migrate rejected non-fresh DB without --resume-bootstrap-from."

          # 2. Running with invalid resume migration must fail
          if node scripts/fresh-install-migrate.cjs --fresh-install --resume-bootstrap-from=invalid_migration_name; then
            echo "::error::fresh-install-migrate succeeded with invalid resume point!"
            exit 1
          fi
          echo "✓ Confirmed: fresh-install-migrate rejected invalid resume point."

      - name: Test rejection of unexpected migration failure
        run: |
          node -e '
            const { evaluateMigrationFailure } = require("./scripts/fresh-install-migrate.cjs");
            const res = evaluateMigrationFailure(
              "Applying migration \`20261201000000_unauthorized_drop\`\nError: P3018\nDatabase error: ERROR: table not found\nMigration name: 20261201000000_unauthorized_drop",
              ["20260815140000_tenant_001_leasing_rental_isolation"]
            );
            if (res.canResolve) {
              console.error("FAILED: Unexpected migration failure was resolved!");
              process.exit(1);
            }
            console.log("PASS: Unexpected migration failure was rejected.");
          '

      - name: Synthetic representative data upgrade test
        run: |
          # Insert representative test data into tenants and rental_rate_quotes
          PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d fleet360_fresh_ci -c "
            INSERT INTO tenants (id, name, code)
            VALUES ('synthetic_tenant_1', 'Synthetic Test Tenant', 'SYNTH_001')
            ON CONFLICT (id) DO NOTHING;

            INSERT INTO rental_rate_quotes (
              id, tenant_id, vehicle_category, pickup_date, dropoff_date,
              total_days, base_rental_charge, total_amount
            )
            VALUES (
              'quote_synth_1', 'synthetic_tenant_1', 'SEDAN', NOW(), NOW() + INTERVAL '3 days',
              3, 150.00, 157.50
            )
            ON CONFLICT (id) DO NOTHING;
          "

          # Verify that running a subsequent migrate deploy against populated DB is a clean no-op without data loss
          npx prisma migrate deploy

          # Verify synthetic records remain intact
          PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d fleet360_fresh_ci -c "
            DO \$\$
            DECLARE
              tenant_cnt INT;
              quote_cnt INT;
            BEGIN
              SELECT count(*) INTO tenant_cnt FROM tenants WHERE id = 'synthetic_tenant_1';
              SELECT count(*) INTO quote_cnt FROM rental_rate_quotes WHERE id = 'quote_synth_1';

              IF tenant_cnt != 1 THEN
                RAISE EXCEPTION 'Synthetic tenant record missing or lost during migration deploy (count=%)', tenant_cnt;
              END IF;

              IF quote_cnt != 1 THEN
                RAISE EXCEPTION 'Synthetic rental quote record missing or lost during migration deploy (count=%)', quote_cnt;
              END IF;
            END
            \$\$;
          "
          echo "✓ Confirmed: Synthetic data preserved across subsequent migrate deploy."

